name: bellfinder
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 2.0.2+25

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  collection: ^1.19.0
  csv: ^8.0.0
  drift: ^2.25.2
  drift_flutter: ^0.3.1
  file_picker: ^13.1.0
  flutter_map: ^8.1.1
  flutter_map_location_marker: ^10.1.0
  flutter_map_marker_cluster: ^8.1.0
  flutter_map_vector_tiles: ^2.9.1
  flutter_svg: ^2.0.16
  geolocator: ^14.0.1
  intl: ^0.20.1
  latlong2: ^0.9.1
  logging: ^1.3.0
  material_ui: ^1.8.0
  package_info_plus: ^10.2.1
  path: ^1.9.1
  path_provider: ^2.1.5
  provider: ^6.1.2
  shared_preferences: ^2.5.3
  sqflite: ^2.4.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.14
  change_app_package_name: ^1.5.0
  drift_dev: ^2.22.1
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
  - assets/dove.json
  - assets/map_style.json
  - assets/tower3.svg
  - assets/tower4.svg
  - assets/tower5.svg
  - assets/tower6.svg
  - assets/tower8.svg
  - assets/tower10.svg
  - assets/tower12.svg
  - assets/tower_unringable.svg
  - assets/icon/bell.png
